[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observeagents"
version = "0.1.0"
description = "ObserveAgents Python SDK — low-level helpers for sending safe, content-free runtime events to the ObserveAgents platform. OpenTelemetry/OTLP is the recommended integration path."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "ObserveAgents" }]
keywords = ["ai", "agents", "observability", "runtime"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# Zero runtime dependencies by design: transport uses the standard library.
dependencies = []

[project.urls]
Homepage = "https://www.observeagents.ai"

[tool.setuptools]
packages = ["observeagents"]
